<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%,
        #16091f 0%,
        #090511 45%,
        #020207 100%);
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w, h, dpr;
let stars = [];
let shooters = [];

const COLORS = [
    [255,255,255], // diamond white
    [190,155,255], // vivid lavender
    [125,175,255], // electric blue
    [95,220,255],  // cyan glow
    [205,105,255], // rich violet
    [255,90,210],  // hot magenta
    [255,125,175], // romantic rose
    [155,105,255]  // deep purple
];

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    makeStars();
}

function makeStars() {
    stars = [];

    const count = Math.min(
        850,
        Math.floor((w * h) / 1500)
    );

    for (let i = 0; i < count; i++) {
        const color =
            COLORS[Math.floor(Math.random() * COLORS.length)];

        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.25 + 0.25,
            base: Math.random() * 0.55 + 0.30,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.0015 + 0.0004,
            drift: Math.random() * 0.006 + 0.001,
            color
        });
    }
}

function shootingStar() {
    if (shooters.length > 1) return;

    const startX = Math.random() * w * 0.75;
    const startY = Math.random() * h * 0.40;

    shooters.push({
        x: startX,
        y: startY,
        vx: 4.5 + Math.random() * 2.5,
        vy: 2.0 + Math.random() * 1.5,
        life: 1,
        length: 90 + Math.random() * 90
    });
}

let last = performance.now();
let nextShooter = performance.now() + 5000;

function draw(now) {

    const dt = Math.min(now - last, 40);
    last = now;

    // Deep purple-black romantic sky
 // Uniform cosmic base for seamless multi-panel display
ctx.fillStyle = "#21104a";
ctx.fillRect(0, 0, w, h);
// Soft colorful nebula atmosphere
// Seam-friendly colorful atmosphere
const t = now * 0.00004;

// Broad horizontal bands extend beyond the canvas edges.
// This keeps neighboring media panels much closer in color.
const bands = [
    {
        y: h * (0.18 + Math.sin(t) * 0.04),
        radius: h * 0.75,
        color: "rgba(210,55,255,0.30)"
    },
    {
        y: h * (0.48 + Math.cos(t * 0.8) * 0.04),
        radius: h * 0.80,
        color: "rgba(255,45,165,0.22)"
    },
    {
        y: h * (0.72 + Math.sin(t * 0.6) * 0.04),
        radius: h * 0.85,
        color: "rgba(35,125,255,0.30)"
    },
    {
        y: h * (0.92 + Math.cos(t * 0.7) * 0.03),
        radius: h * 0.65,
        color: "rgba(20,210,255,0.18)"
    }
];

for (const band of bands) {
    const glow = ctx.createLinearGradient(
        0,
        band.y - band.radius,
        0,
        band.y + band.radius
    );

    glow.addColorStop(0, "rgba(0,0,0,0)");
    glow.addColorStop(0.5, band.color);
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
}
}
    // Stars
    for (const s of stars) {

        s.phase += s.speed * dt;
        s.x += s.drift * dt;

        if (s.x > w + 5) s.x = -5;

        const twinkle =
            s.base +
            Math.sin(s.phase) * 0.22;

        const alpha =
            Math.max(.12, Math.min(.95, twinkle));

        const [r,g,b] = s.color;

        // Soft halo on selected stars
        if (s.r > .9) {
            ctx.beginPath();
            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * .12})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        // Star center
        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    // Shooting stars
    for (let i = shooters.length - 1; i >= 0; i--) {

        const s = shooters[i];

        const mag =
            Math.sqrt(s.vx*s.vx + s.vy*s.vy);

        const tx =
            s.x - (s.vx/mag) * s.length;

        const ty =
            s.y - (s.vy/mag) * s.length;

        const grad =
            ctx.createLinearGradient(
                tx,ty,s.x,s.y
            );

        grad.addColorStop(
            0,
            "rgba(180,130,255,0)"
        );

        grad.addColorStop(
            .55,
            `rgba(215,175,255,${s.life * .25})`
        );

        grad.addColorStop(
            1,
            `rgba(255,225,255,${s.life})`
        );

        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(tx,ty);
        ctx.lineTo(s.x,s.y);
        ctx.stroke();

        s.x += s.vx * dt * .06;
        s.y += s.vy * dt * .06;

        s.life -= dt * .0007;

        if (s.life <= 0) {
            shooters.splice(i,1);
        }
    }

    if (now > nextShooter) {
        shootingStar();

        // Random: roughly every 6–13 seconds
        nextShooter =
            now + 6000 + Math.random() * 7000;
    }

    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
