<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070512;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<script>

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w;
let h;
let dpr;

let stars = [];
let shooters = [];


/* =========================================
   MISTY STAR COLORS
========================================= */

const COLORS = [
    [255,255,255],
    [225,195,255],
    [145,190,255],
    [90,225,255],
    [215,120,255],
    [255,85,215],
    [255,120,180],
    [175,115,255]
];


/* =========================================
   SHOOTING STAR COLORS
========================================= */

const SHOOTER_COLORS = [
    [255,245,255],
    [225,180,255],
    [255,130,220],
    [145,190,255],
    [100,225,255]
];


/* =========================================
   RESIZE
========================================= */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(
        dpr, 0,
        0, dpr,
        0, 0
    );

    makeStars();
}


/* =========================================
   CREATE BACKGROUND STARS
========================================= */

function makeStars() {

    stars = [];

    const count = Math.min(
        1350,
        Math.floor((w * h) / 850)
    );

    for (let i = 0; i < count; i++) {

        const color =
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ];

        stars.push({

            x: Math.random() * w,
            y: Math.random() * h,

            r:
                Math.random() * 1.45 + 0.35,

            base:
                Math.random() * 0.42 + 0.50,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.0011 + 0.0003,

            drift:
                Math.random() * 0.0035 + 0.0007,

            color
        });
    }
}


/* =========================================
   CREATE SHOOTING STAR
========================================= */

function shootingStar(delayX = 0, delayY = 0) {

    if (shooters.length >= 8) return;

    const color =
        SHOOTER_COLORS[
            Math.floor(
                Math.random() *
                SHOOTER_COLORS.length
            )
        ];

    shooters.push({

        x:
            Math.random() * w * 0.68 + delayX,

        y:
            Math.random() * h * 0.42 + delayY,

        vx:
            3.0 + Math.random() * 2.3,

        vy:
            1.1 + Math.random() * 1.3,

        life:
            0.90 + Math.random() * 0.25,

        length:
            100 + Math.random() * 180,

        width:
            1.4 + Math.random() * 1.3,

        color
    });
}


/* =========================================
   METEOR BURST
========================================= */

function meteorBurst() {

    const amount =
        2 + Math.floor(Math.random() * 2);

    for (let i = 0; i < amount; i++) {

        setTimeout(() => {

            shootingStar(
                Math.random() * 80,
                Math.random() * 45
            );

        }, i * 180);
    }
}


let last = performance.now();

let nextShooter =
    performance.now() + 900;


/* =========================================
   MAIN ANIMATION
========================================= */

function draw(now) {

    const dt =
        Math.min(now - last, 40);

    last = now;


    /* =====================================
       DARK ROMANTIC BASE
    ===================================== */

    ctx.fillStyle = "#070512";

    ctx.fillRect(
        0, 0,
        w, h
    );


    /* =====================================
       COLORFUL NEBULA
    ===================================== */

    const t =
        now * 0.000035;


    const bands = [

        {
            y:
                h * (
                    0.10 +
                    Math.sin(t) * 0.025
                ),

            radius:
                h * 0.44,

            color:
                "rgba(185,35,255,0.68)"
        },

        {
            y:
                h * (
                    0.30 +
                    Math.cos(t * 0.8) * 0.025
                ),

            radius:
                h * 0.38,

            color:
                "rgba(255,25,175,0.55)"
        },

        {
            y:
                h * (
                    0.57 +
                    Math.sin(t * 0.65) * 0.025
                ),

            radius:
                h * 0.43,

            color:
                "rgba(45,80,255,0.64)"
        },

        {
            y:
                h * (
                    0.82 +
                    Math.cos(t * 0.7) * 0.020
                ),

            radius:
                h * 0.36,

            color:
                "rgba(0,205,255,0.46)"
        }
    ];


    for (const band of bands) {

        const glow =
            ctx.createLinearGradient(
                0,
                band.y - band.radius,
                0,
                band.y + band.radius
            );

        glow.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );

        glow.addColorStop(
            0.28,
            band.color
        );

        glow.addColorStop(
            0.50,
            band.color
        );

        glow.addColorStop(
            0.72,
            band.color
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
            0, 0,
            w, h
        );
    }


    /* =====================================
       DEEP PURPLE VEIL
    ===================================== */

    const veil =
        ctx.createLinearGradient(
            0, 0,
            0, h
        );

    veil.addColorStop(
        0,
        "rgba(25,5,45,0.12)"
    );

    veil.addColorStop(
        0.5,
        "rgba(5,0,20,0.04)"
    );

    veil.addColorStop(
        1,
        "rgba(0,5,30,0.12)"
    );

    ctx.fillStyle = veil;

    ctx.fillRect(
        0, 0,
        w, h
    );


    /* =====================================
       TWINKLING STARS
    ===================================== */

    for (const s of stars) {

        s.phase +=
            s.speed * dt;

        s.x +=
            s.drift * dt;


        if (s.x > w + 8) {
            s.x = -8;
        }


        const twinkle =
            s.base +
            Math.sin(s.phase) * 0.22;


        const alpha =
            Math.max(
                0.32,
                Math.min(
                    1,
                    twinkle
                )
            );


        const [r,g,b] =
            s.color;


        /* SOFT GLOW */

        if (s.r > 0.9) {

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * 0.14})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4.2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /* STAR CENTER */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* DIAMOND SPARKLE */

        if (
            s.r > 1.45 &&
            alpha > 0.76
        ) {

            ctx.strokeStyle =
                `rgba(${r},${g},${b},${alpha * 0.50})`;

            ctx.lineWidth = 0.65;

            ctx.beginPath();

            ctx.moveTo(
                s.x - s.r * 3.2,
                s.y
            );

            ctx.lineTo(
                s.x + s.r * 3.2,
                s.y
            );

            ctx.moveTo(
                s.x,
                s.y - s.r * 3.2
            );

            ctx.lineTo(
                s.x,
                s.y + s.r * 3.2
            );

            ctx.stroke();
        }
    }


    /* =====================================
       METEOR SHOWER
    ===================================== */

    for (
        let i = shooters.length - 1;
        i >= 0;
        i--
    ) {

        const s = shooters[i];

        const [r,g,b] = s.color;


        const magnitude =
            Math.sqrt(
                s.vx * s.vx +
                s.vy * s.vy
            );


        const tailX =
            s.x -
            (s.vx / magnitude) *
            s.length;


        const tailY =
            s.y -
            (s.vy / magnitude) *
            s.length;


        const trail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                s.x,
                s.y
            );


        trail.addColorStop(
            0,
            `rgba(${r},${g},${b},0)`
        );


        trail.addColorStop(
            0.45,
            `rgba(${r},${g},${b},${s.life * 0.28})`
        );


        trail.addColorStop(
            0.78,
            `rgba(${r},${g},${b},${s.life * 0.72})`
        );


        trail.addColorStop(
            1,
            `rgba(255,250,255,${s.life})`
        );


        ctx.strokeStyle = trail;

        ctx.lineWidth = s.width;


        ctx.beginPath();

        ctx.moveTo(
            tailX,
            tailY
        );

        ctx.lineTo(
            s.x,
            s.y
        );

        ctx.stroke();


        /* SHOOTING STAR GLOW */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${s.life * 0.18})`;

        ctx.arc(
            s.x,
            s.y,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* SHOOTING STAR HEAD */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,250,255,${s.life})`;

        ctx.arc(
            s.x,
            s.y,
            2.2,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* MOVE */

        s.x +=
            s.vx * dt * 0.055;

        s.y +=
            s.vy * dt * 0.055;


        /* FADE */

        s.life -=
            dt * 0.00058;


        if (s.life <= 0) {

            shooters.splice(
                i,
                1
            );
        }
    }


    /* =====================================
       FIRE THE NEXT METEOR

       Every 0.7 - 1.8 seconds.

       Sometimes fires a 2-3 star burst.
    ===================================== */

    if (now > nextShooter) {

        if (Math.random() < 0.32) {

            meteorBurst();

        } else {

            shootingStar();
        }


        nextShooter =
            now +
            700 +
            Math.random() * 1100;
    }


    requestAnimationFrame(draw);
}


/* =========================================
   START THE SKY
========================================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(draw);

</script>

</body>
</html>
