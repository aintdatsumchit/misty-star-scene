<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070512;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<script>

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w, h, dpr;
let stars = [];
let meteors = [];

const STAR_COLORS = [
    [255,255,255],
    [225,195,255],
    [145,190,255],
    [90,225,255],
    [215,120,255],
    [255,85,215],
    [255,120,180],
    [175,115,255]
];

const METEOR_COLORS = [
    [255,255,255],
    [230,190,255],
    [255,120,220],
    [130,200,255],
    [100,235,255]
];


/* =========================================
   RESIZE
========================================= */

function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    makeStars();
}


/* =========================================
   BACKGROUND STARS
========================================= */

function makeStars() {

    stars = [];

    const count = Math.min(
        1350,
        Math.floor((w * h) / 850)
    );

    for (let i = 0; i < count; i++) {

        const color =
            STAR_COLORS[
                Math.floor(Math.random() * STAR_COLORS.length)
            ];

        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.45 + 0.35,
            base: Math.random() * 0.42 + 0.50,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.0011 + 0.0003,
            drift: Math.random() * 0.0035 + 0.0007,
            color
        });
    }
}


/* =========================================
   CREATE METEOR
========================================= */

function createMeteor(offset = 0) {

    if (meteors.length >= 10) return;

    const color =
        METEOR_COLORS[
            Math.floor(Math.random() * METEOR_COLORS.length)
        ];

    /*
       Meteor begins slightly off the
       LEFT side of the screen.

       This guarantees that it travels
       visibly across the scene.
    */

    meteors.push({

        x: -150 - offset,

        y:
            h * (0.08 + Math.random() * 0.48),

        speed:
            650 + Math.random() * 350,

        slope:
            0.30 + Math.random() * 0.18,

        length:
            180 + Math.random() * 180,

        width:
            2.5 + Math.random() * 2.5,

        color
    });
}


/* =========================================
   METEOR BURST
========================================= */

function meteorBurst() {

    const amount =
        2 + Math.floor(Math.random() * 2);

    for (let i = 0; i < amount; i++) {

        setTimeout(() => {

            createMeteor(i * 100);

        }, i * 180);
    }
}


let last = performance.now();
let nextMeteor = performance.now() + 700;


/* =========================================
   MAIN DRAW LOOP
========================================= */

function draw(now) {

    const dt =
        Math.min(now - last, 40) / 1000;

    last = now;


    /* =====================================
       DARK ROMANTIC BACKGROUND
    ===================================== */

    ctx.fillStyle = "#070512";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* =====================================
       COLORFUL NEBULA
    ===================================== */

    const t = now * 0.000035;

    const bands = [

        {
            y:
                h * (
                    0.10 +
                    Math.sin(t) * 0.025
                ),

            radius:
                h * 0.44,

            color:
                "rgba(185,35,255,0.68)"
        },

        {
            y:
                h * (
                    0.30 +
                    Math.cos(t * 0.8) * 0.025
                ),

            radius:
                h * 0.38,

            color:
                "rgba(255,25,175,0.55)"
        },

        {
            y:
                h * (
                    0.57 +
                    Math.sin(t * 0.65) * 0.025
                ),

            radius:
                h * 0.43,

            color:
                "rgba(45,80,255,0.64)"
        },

        {
            y:
                h * (
                    0.82 +
                    Math.cos(t * 0.7) * 0.020
                ),

            radius:
                h * 0.36,

            color:
                "rgba(0,205,255,0.46)"
        }
    ];


    for (const band of bands) {

        const glow =
            ctx.createLinearGradient(
                0,
                band.y - band.radius,
                0,
                band.y + band.radius
            );

        glow.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );

        glow.addColorStop(
            0.28,
            band.color
        );

        glow.addColorStop(
            0.50,
            band.color
        );

        glow.addColorStop(
            0.72,
            band.color
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
            0,
            0,
            w,
            h
        );
    }


    /* =====================================
       DARK PURPLE VEIL
    ===================================== */

    const veil =
        ctx.createLinearGradient(
            0,
            0,
            0,
            h
        );

    veil.addColorStop(
        0,
        "rgba(25,5,45,0.12)"
    );

    veil.addColorStop(
        0.5,
        "rgba(5,0,20,0.04)"
    );

    veil.addColorStop(
        1,
        "rgba(0,5,30,0.12)"
    );

    ctx.fillStyle = veil;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* =====================================
       TWINKLING STARS
    ===================================== */

    for (const s of stars) {

        s.phase +=
            s.speed * dt * 1000;

        s.x +=
            s.drift * dt * 1000;


        if (s.x > w + 8) {
            s.x = -8;
        }


        const twinkle =
            s.base +
            Math.sin(s.phase) * 0.22;


        const alpha =
            Math.max(
                0.32,
                Math.min(1, twinkle)
            );


        const [r,g,b] = s.color;


        /* STAR GLOW */

        if (s.r > 0.9) {

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * 0.14})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4.2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /* STAR */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* DIAMOND TWINKLE */

        if (
            s.r > 1.45 &&
            alpha > 0.76
        ) {

            ctx.strokeStyle =
                `rgba(${r},${g},${b},${alpha * 0.50})`;

            ctx.lineWidth = 0.65;

            ctx.beginPath();

            ctx.moveTo(
                s.x - s.r * 3.2,
                s.y
            );

            ctx.lineTo(
                s.x + s.r * 3.2,
                s.y
            );

            ctx.moveTo(
                s.x,
                s.y - s.r * 3.2
            );

            ctx.lineTo(
                s.x,
                s.y + s.r * 3.2
            );

            ctx.stroke();
        }
    }


    /* =====================================
       BIG BRIGHT METEORS
    ===================================== */

    for (
        let i = meteors.length - 1;
        i >= 0;
        i--
    ) {

        const m = meteors[i];

        const [r,g,b] = m.color;


        /*
           Direction vector
        */

        const dx = 1;
        const dy = m.slope;

        const magnitude =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const ux = dx / magnitude;
        const uy = dy / magnitude;


        /*
           Tail location
        */

        const tailX =
            m.x -
            ux * m.length;

        const tailY =
            m.y -
            uy * m.length;


        /* =================================
           HUGE OUTER GLOW
        ================================= */

        const outerTrail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                m.x,
                m.y
            );

        outerTrail.addColorStop(
            0,
            `rgba(${r},${g},${b},0)`
        );

        outerTrail.addColorStop(
            0.55,
            `rgba(${r},${g},${b},0.10)`
        );

        outerTrail.addColorStop(
            1,
            `rgba(${r},${g},${b},0.50)`
        );

        ctx.strokeStyle = outerTrail;

        ctx.lineWidth =
            m.width * 4;

        ctx.beginPath();

        ctx.moveTo(
            tailX,
            tailY
        );

        ctx.lineTo(
            m.x,
            m.y
        );

        ctx.stroke();


        /* =================================
           BRIGHT METEOR TRAIL
        ================================= */

        const trail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                m.x,
                m.y
            );

        trail.addColorStop(
            0,
            `rgba(${r},${g},${b},0)`
        );

        trail.addColorStop(
            0.35,
            `rgba(${r},${g},${b},0.25)`
        );

        trail.addColorStop(
            0.70,
            `rgba(${r},${g},${b},0.75)`
        );

        trail.addColorStop(
            1,
            "rgba(255,255,255,1)"
        );


        ctx.strokeStyle = trail;

        ctx.lineWidth =
            m.width;

        ctx.beginPath();

        ctx.moveTo(
            tailX,
            tailY
        );

        ctx.lineTo(
            m.x,
            m.y
        );

        ctx.stroke();


        /* =================================
           METEOR HEAD GLOW
        ================================= */

        const headGlow =
            ctx.createRadialGradient(
                m.x,
                m.y,
                0,
                m.x,
                m.y,
                18
            );

        headGlow.addColorStop(
            0,
            "rgba(255,255,255,1)"
        );

        headGlow.addColorStop(
            0.20,
            `rgba(${r},${g},${b},0.90)`
        );

        headGlow.addColorStop(
            1,
            `rgba(${r},${g},${b},0)`
        );

        ctx.fillStyle = headGlow;

        ctx.beginPath();

        ctx.arc(
            m.x,
            m.y,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* =================================
           BRIGHT WHITE CORE
        ================================= */

        ctx.fillStyle =
            "rgba(255,255,255,1)";

        ctx.beginPath();

        ctx.arc(
            m.x,
            m.y,
            3.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* =================================
           MOVE METEOR ACROSS SCREEN
        ================================= */

        const move =
            m.speed * dt;

        m.x +=
            ux * move;

        m.y +=
            uy * move;


        /*
           Remove only AFTER meteor
           completely crosses the screen.
        */

        if (
            m.x > w + m.length ||
            m.y > h + m.length
        ) {

            meteors.splice(
                i,
                1
            );
        }
    }


    /* =====================================
       METEOR SHOWER TIMER

       One roughly every 0.7 - 1.5 sec.

       40% chance of a 2-3 meteor burst.
    ===================================== */

    if (now > nextMeteor) {

        if (Math.random() < 0.40) {

            meteorBurst();

        } else {

            createMeteor();
        }


        nextMeteor =
            now +
            700 +
            Math.random() * 800;
    }


    requestAnimationFrame(draw);
}


/* =========================================
   START
========================================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(draw);

</script>

</body>
</html>
