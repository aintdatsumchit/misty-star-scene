<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #21104a;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<script>

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w;
let h;
let dpr;

let stars = [];
let shooters = [];


/* =========================================
   MISTY COLOR PALETTE
========================================= */

const COLORS = [
    [255,255,255], // diamond white
    [220,190,255], // lavender
    [130,185,255], // electric blue
    [90,225,255],  // cyan
    [210,110,255], // violet
    [255,90,215],  // magenta
    [255,125,180], // rose
    [170,115,255]  // deep purple
];


/* =========================================
   RESIZE
========================================= */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(
        dpr, 0,
        0, dpr,
        0, 0
    );

    makeStars();
}


/* =========================================
   CREATE STARS
========================================= */

function makeStars() {

    stars = [];

    const count = Math.min(
        1300,
        Math.floor((w * h) / 900)
    );

    for (let i = 0; i < count; i++) {

        const color =
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ];

        stars.push({

            x: Math.random() * w,
            y: Math.random() * h,

            r:
                Math.random() * 1.45 + 0.35,

            base:
                Math.random() * 0.45 + 0.48,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.0012 + 0.00035,

            drift:
                Math.random() * 0.004 + 0.0008,

            color
        });
    }
}


/* =========================================
   SHOOTING STAR
========================================= */

function shootingStar() {

    if (shooters.length >= 2) return;

    shooters.push({

        x:
            Math.random() * w * 0.70,

        y:
            Math.random() * h * 0.35,

        vx:
            3.5 + Math.random() * 1.8,

        vy:
            1.4 + Math.random() * 1.0,

        life: 1,

        length:
            110 + Math.random() * 100
    });
}


let last = performance.now();

let nextShooter =
    performance.now() + 5000;


/* =========================================
   MAIN ANIMATION
========================================= */

function draw(now) {

    const dt =
        Math.min(now - last, 40);

    last = now;


    /* =====================================
       SEAM-FRIENDLY BASE

       Same base color reaches BOTH sides
       of every media panel.
    ===================================== */

    ctx.fillStyle = "#21104a";

    ctx.fillRect(
        0, 0,
        w, h
    );


    /* =====================================
       COLORFUL COSMIC ATMOSPHERE

       Horizontal gradients mean the LEFT
       and RIGHT edges remain identical.
       This helps hide sphere panel seams.
    ===================================== */

    const t =
        now * 0.00004;


    const bands = [

        {
            y:
                h * (
                    0.12 +
                    Math.sin(t) * 0.035
                ),

            radius:
                h * 0.72,

            color:
                "rgba(190,55,255,0.42)"
        },

        {
            y:
                h * (
                    0.36 +
                    Math.cos(t * 0.8) * 0.035
                ),

            radius:
                h * 0.76,

            color:
                "rgba(255,45,175,0.30)"
        },

        {
            y:
                h * (
                    0.64 +
                    Math.sin(t * 0.65) * 0.035
                ),

            radius:
                h * 0.82,

            color:
                "rgba(45,105,255,0.42)"
        },

        {
            y:
                h * (
                    0.88 +
                    Math.cos(t * 0.7) * 0.025
                ),

            radius:
                h * 0.68,

            color:
                "rgba(20,210,255,0.24)"
        }
    ];


    for (const band of bands) {

        const glow =
            ctx.createLinearGradient(
                0,
                band.y - band.radius,
                0,
                band.y + band.radius
            );

        glow.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );

        glow.addColorStop(
            0.50,
            band.color
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
            0, 0,
            w, h
        );
    }


    /* =====================================
       STARS
    ===================================== */

    for (const s of stars) {

        s.phase +=
            s.speed * dt;

        s.x +=
            s.drift * dt;


        if (s.x > w + 8) {

            s.x = -8;
        }


        const twinkle =
            s.base +
            Math.sin(s.phase) * 0.20;


        const alpha =
            Math.max(
                0.30,
                Math.min(
                    1,
                    twinkle
                )
            );


        const [r,g,b] =
            s.color;


        /* Soft colored glow */

        if (s.r > 0.9) {

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * 0.15})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4.5,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /* Bright star center */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Occasional diamond sparkle */

        if (
            s.r > 1.45 &&
            alpha > 0.72
        ) {

            ctx.strokeStyle =
                `rgba(${r},${g},${b},${alpha * 0.45})`;

            ctx.lineWidth = 0.6;

            ctx.beginPath();

            ctx.moveTo(
                s.x - s.r * 3,
                s.y
            );

            ctx.lineTo(
                s.x + s.r * 3,
                s.y
            );

            ctx.moveTo(
                s.x,
                s.y - s.r * 3
            );

            ctx.lineTo(
                s.x,
                s.y + s.r * 3
            );

            ctx.stroke();
        }
    }


    /* =====================================
       SHOOTING STARS
    ===================================== */

    for (
        let i = shooters.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shooters[i];


        const magnitude =
            Math.sqrt(
                s.vx * s.vx +
                s.vy * s.vy
            );


        const tailX =
            s.x -
            (s.vx / magnitude) *
            s.length;


        const tailY =
            s.y -
            (s.vy / magnitude) *
            s.length;


        const trail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                s.x,
                s.y
            );


        trail.addColorStop(
            0,
            "rgba(140,100,255,0)"
        );


        trail.addColorStop(
            0.50,
            `rgba(210,145,255,${s.life * 0.30})`
        );


        trail.addColorStop(
            0.82,
            `rgba(255,145,225,${s.life * 0.65})`
        );


        trail.addColorStop(
            1,
            `rgba(255,245,255,${s.life})`
        );


        ctx.strokeStyle =
            trail;

        ctx.lineWidth =
            1.7;


        ctx.beginPath();

        ctx.moveTo(
            tailX,
            tailY
        );

        ctx.lineTo(
            s.x,
            s.y
        );

        ctx.stroke();


        /* Bright shooting-star head */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,240,255,${s.life})`;

        ctx.arc(
            s.x,
            s.y,
            1.8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        s.x +=
            s.vx * dt * 0.05;

        s.y +=
            s.vy * dt * 0.05;


        s.life -=
            dt * 0.00065;


        if (s.life <= 0) {

            shooters.splice(
                i,
                1
            );
        }
    }


    /* New shooting star roughly
       every 6–12 seconds */

    if (now > nextShooter) {

        shootingStar();

        nextShooter =
            now +
            6000 +
            Math.random() * 6000;
    }


    requestAnimationFrame(draw);
}


/* =========================================
   START
========================================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(draw);

</script>

</body>
</html>
