<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020107;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<script>

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w, h, dpr;

let stars = [];
let meteors = [];


/* =========================================
   BRIGHT STAR COLORS
========================================= */

const STAR_COLORS = [
    [255,255,255],
    [230,205,255],
    [150,195,255],
    [90,230,255],
    [220,125,255],
    [255,90,220],
    [255,125,185],
    [185,125,255]
];


/* =========================================
   METEOR COLORS
========================================= */

const METEOR_COLORS = [
    [255,255,255],
    [230,190,255],
    [255,120,220],
    [130,200,255],
    [100,235,255]
];


/* =========================================
   RESIZE
========================================= */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(
        dpr, 0,
        0, dpr,
        0, 0
    );

    makeStars();
}


/* =========================================
   CREATE STARS
========================================= */

function makeStars() {

    stars = [];

    const count = Math.min(
        1450,
        Math.floor((w * h) / 800)
    );

    for (let i = 0; i < count; i++) {

        const color =
            STAR_COLORS[
                Math.floor(
                    Math.random() *
                    STAR_COLORS.length
                )
            ];

        stars.push({

            x: Math.random() * w,
            y: Math.random() * h,

            r:
                Math.random() * 1.55 + 0.35,

            base:
                Math.random() * 0.38 + 0.58,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.0011 + 0.0003,

            drift:
                Math.random() * 0.003 + 0.0005,

            color
        });
    }
}


/* =========================================
   CREATE METEOR
========================================= */

function createMeteor(offset = 0) {

    if (meteors.length >= 10) return;

    const color =
        METEOR_COLORS[
            Math.floor(
                Math.random() *
                METEOR_COLORS.length
            )
        ];

    meteors.push({

        x:
            -180 - offset,

        y:
            h * (
                0.06 +
                Math.random() * 0.50
            ),

        speed:
            650 +
            Math.random() * 350,

        slope:
            0.28 +
            Math.random() * 0.18,

        length:
            200 +
            Math.random() * 190,

        width:
            2.5 +
            Math.random() * 2.4,

        color
    });
}


/* =========================================
   METEOR BURST
========================================= */

function meteorBurst() {

    const amount =
        2 +
        Math.floor(
            Math.random() * 2
        );

    for (let i = 0; i < amount; i++) {

        setTimeout(() => {

            createMeteor(
                i * 100
            );

        }, i * 180);
    }
}


let last =
    performance.now();

let nextMeteor =
    performance.now() + 700;


/* =========================================
   MAIN DRAW LOOP
========================================= */

function draw(now) {

    const dt =
        Math.min(
            now - last,
            40
        ) / 1000;

    last = now;


    /* =====================================
       VERY DARK SPACE BASE
    ===================================== */

    ctx.fillStyle =
        "#020107";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* =====================================
       DARK ROMANTIC NEBULA

       These colors are intentionally
       restrained so the stars dominate.
    ===================================== */

    const t =
        now * 0.000030;


    const bands = [

        /* DEEP VIOLET */

        {
            y:
                h * (
                    0.10 +
                    Math.sin(t) * 0.020
                ),

            radius:
                h * 0.42,

            color:
                "rgba(90,15,150,0.32)"
        },


        /* DARK WINE / MAGENTA */

        {
            y:
                h * (
                    0.31 +
                    Math.cos(t * 0.8) * 0.022
                ),

            radius:
                h * 0.36,

            color:
                "rgba(125,10,85,0.25)"
        },


        /* MIDNIGHT BLUE */

        {
            y:
                h * (
                    0.58 +
                    Math.sin(t * 0.65) * 0.020
                ),

            radius:
                h * 0.42,

            color:
                "rgba(20,35,135,0.32)"
        },


        /* DARK CYAN */

        {
            y:
                h * (
                    0.84 +
                    Math.cos(t * 0.7) * 0.018
                ),

            radius:
                h * 0.34,

            color:
                "rgba(0,85,115,0.22)"
        }
    ];


    for (const band of bands) {

        const glow =
            ctx.createLinearGradient(
                0,
                band.y - band.radius,
                0,
                band.y + band.radius
            );


        glow.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );


        glow.addColorStop(
            0.32,
            band.color
        );


        glow.addColorStop(
            0.50,
            band.color
        );


        glow.addColorStop(
            0.68,
            band.color
        );


        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            glow;


        ctx.fillRect(
            0,
            0,
            w,
            h
        );
    }


    /* =====================================
       DEEP SPACE VEIL
    ===================================== */

    const veil =
        ctx.createLinearGradient(
            0,
            0,
            0,
            h
        );


    veil.addColorStop(
        0,
        "rgba(0,0,5,0.20)"
    );


    veil.addColorStop(
        0.45,
        "rgba(5,0,15,0.08)"
    );


    veil.addColorStop(
        1,
        "rgba(0,0,10,0.24)"
    );


    ctx.fillStyle =
        veil;


    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* =====================================
       TWINKLING STARS
    ===================================== */

    for (const s of stars) {

        s.phase +=
            s.speed *
            dt *
            1000;


        s.x +=
            s.drift *
            dt *
            1000;


        if (s.x > w + 8) {

            s.x = -8;
        }


        const twinkle =
            s.base +
            Math.sin(
                s.phase
            ) * 0.22;


        const alpha =
            Math.max(
                0.40,
                Math.min(
                    1,
                    twinkle
                )
            );


        const [r,g,b] =
            s.color;


        /* STAR GLOW */

        if (s.r > 0.85) {

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * 0.18})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4.8,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /* BRIGHT STAR */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* DIAMOND SPARKLE */

        if (
            s.r > 1.45 &&
            alpha > 0.76
        ) {

            ctx.strokeStyle =
                `rgba(${r},${g},${b},${alpha * 0.58})`;

            ctx.lineWidth =
                0.7;


            ctx.beginPath();


            ctx.moveTo(
                s.x - s.r * 3.5,
                s.y
            );

            ctx.lineTo(
                s.x + s.r * 3.5,
                s.y
            );


            ctx.moveTo(
                s.x,
                s.y - s.r * 3.5
            );

            ctx.lineTo(
                s.x,
                s.y + s.r * 3.5
            );


            ctx.stroke();
        }
    }


    /* =====================================
       BIG BRIGHT METEORS
    ===================================== */

    for (
        let i = meteors.length - 1;
        i >= 0;
        i--
    ) {

        const m =
            meteors[i];


        const [r,g,b] =
            m.color;


        const dx = 1;
        const dy = m.slope;


        const magnitude =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        const ux =
            dx / magnitude;

        const uy =
            dy / magnitude;


        const tailX =
            m.x -
            ux * m.length;


        const tailY =
            m.y -
            uy * m.length;


        /* =================================
           LARGE SOFT METEOR GLOW
        ================================= */

        const outerTrail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                m.x,
                m.y
            );


        outerTrail.addColorStop(
            0,
            `rgba(${r},${g},${b},0)`
        );


        outerTrail.addColorStop(
            0.50,
            `rgba(${r},${g},${b},0.12)`
        );


        outerTrail.addColorStop(
            1,
            `rgba(${r},${g},${b},0.58)`
        );


        ctx.strokeStyle =
            outerTrail;


        ctx.lineWidth =
            m.width * 4;


        ctx.beginPath();


        ctx.moveTo(
            tailX,
            tailY
        );


        ctx.lineTo(
            m.x,
            m.y
        );


        ctx.stroke();


        /* =================================
           BRIGHT METEOR TRAIL
        ================================= */

        const trail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                m.x,
                m.y
            );


        trail.addColorStop(
            0,
            `rgba(${r},${g},${b},0)`
        );


        trail.addColorStop(
            0.35,
            `rgba(${r},${g},${b},0.30)`
        );


        trail.addColorStop(
            0.70,
            `rgba(${r},${g},${b},0.85)`
        );


        trail.addColorStop(
            1,
            "rgba(255,255,255,1)"
        );


        ctx.strokeStyle =
            trail;


        ctx.lineWidth =
            m.width;


        ctx.beginPath();


        ctx.moveTo(
            tailX,
            tailY
        );


        ctx.lineTo(
            m.x,
            m.y
        );


        ctx.stroke();


        /* =================================
           METEOR HEAD GLOW
        ================================= */

        const headGlow =
            ctx.createRadialGradient(
                m.x,
                m.y,
                0,
                m.x,
                m.y,
                20
            );


        headGlow.addColorStop(
            0,
            "rgba(255,255,255,1)"
        );


        headGlow.addColorStop(
            0.18,
            `rgba(${r},${g},${b},1)`
        );


        headGlow.addColorStop(
            1,
            `rgba(${r},${g},${b},0)`
        );


        ctx.fillStyle =
            headGlow;


        ctx.beginPath();


        ctx.arc(
            m.x,
            m.y,
            20,
            0,
            Math.PI * 2
        );


        ctx.fill();


        /* =================================
           WHITE METEOR CORE
        ================================= */

        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();


        ctx.arc(
            m.x,
            m.y,
            3.8,
            0,
            Math.PI * 2
        );


        ctx.fill();


        /* =================================
           MOVE METEOR
        ================================= */

        const move =
            m.speed * dt;


        m.x +=
            ux * move;


        m.y +=
            uy * move;


        /* REMOVE AFTER CROSSING SCREEN */

        if (
            m.x > w + m.length ||
            m.y > h + m.length
        ) {

            meteors.splice(
                i,
                1
            );
        }
    }


    /* =====================================
       METEOR SHOWER

       Roughly every 0.7 - 1.5 seconds.

       40% chance of 2-3 meteor burst.
    ===================================== */

    if (now > nextMeteor) {

        if (
            Math.random() < 0.40
        ) {

            meteorBurst();

        } else {

            createMeteor();
        }


        nextMeteor =
            now +
            700 +
            Math.random() * 800;
    }


    requestAnimationFrame(
        draw
    );
}


/* =========================================
   START
========================================= */

window.addEventListener(
    "resize",
    resize
);


resize();


requestAnimationFrame(
    draw
);

</script>

</body>
</html>
