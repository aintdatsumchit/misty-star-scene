<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misty's Stars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070512;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<script>

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d", { alpha: false });

let w;
let h;
let dpr;

let stars = [];
let shooters = [];


/* =========================================
   MISTY STAR COLORS
========================================= */

const COLORS = [
    [255,255,255], // diamond white
    [225,195,255], // lavender
    [145,190,255], // electric blue
    [90,225,255],  // cyan
    [215,120,255], // violet
    [255,85,215],  // magenta
    [255,120,180], // rose pink
    [175,115,255]  // deep purple
];


/* =========================================
   RESIZE
========================================= */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(
        dpr, 0,
        0, dpr,
        0, 0
    );

    makeStars();
}


/* =========================================
   CREATE STARS
========================================= */

function makeStars() {

    stars = [];

    const count = Math.min(
        1350,
        Math.floor((w * h) / 850)
    );

    for (let i = 0; i < count; i++) {

        const color =
            COLORS[
                Math.floor(
                    Math.random() * COLORS.length
                )
            ];

        stars.push({

            x: Math.random() * w,
            y: Math.random() * h,

            r:
                Math.random() * 1.45 + 0.35,

            base:
                Math.random() * 0.42 + 0.50,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.0011 + 0.0003,

            drift:
                Math.random() * 0.0035 + 0.0007,

            color
        });
    }
}


/* =========================================
   CREATE SHOOTING STAR
========================================= */

function shootingStar() {

    if (shooters.length >= 2) return;

    shooters.push({

        x:
            Math.random() * w * 0.72,

        y:
            Math.random() * h * 0.32,

        vx:
            3.2 + Math.random() * 1.7,

        vy:
            1.3 + Math.random() * 0.9,

        life: 1,

        length:
            110 + Math.random() * 110
    });
}


let last = performance.now();

let nextShooter =
    performance.now() + 4500;


/* =========================================
   MAIN ANIMATION
========================================= */

function draw(now) {

    const dt =
        Math.min(now - last, 40);

    last = now;


    /* =====================================
       DARK ROMANTIC BASE
    ===================================== */

    ctx.fillStyle = "#070512";

    ctx.fillRect(
        0, 0,
        w, h
    );


    /* =====================================
       COLORFUL NEBULA ATMOSPHERE

       Dark space remains visible between
       stronger purple, pink, blue and cyan.
       Horizontal gradients help neighboring
       media panels blend together.
    ===================================== */

    const t =
        now * 0.000035;


    const bands = [

        {
            y:
                h * (
                    0.10 +
                    Math.sin(t) * 0.025
                ),

            radius:
                h * 0.44,

            color:
                "rgba(185,35,255,0.68)"
        },

        {
            y:
                h * (
                    0.30 +
                    Math.cos(t * 0.8) * 0.025
                ),

            radius:
                h * 0.38,

            color:
                "rgba(255,25,175,0.55)"
        },

        {
            y:
                h * (
                    0.57 +
                    Math.sin(t * 0.65) * 0.025
                ),

            radius:
                h * 0.43,

            color:
                "rgba(45,80,255,0.64)"
        },

        {
            y:
                h * (
                    0.82 +
                    Math.cos(t * 0.7) * 0.020
                ),

            radius:
                h * 0.36,

            color:
                "rgba(0,205,255,0.46)"
        }
    ];


    for (const band of bands) {

        const glow =
            ctx.createLinearGradient(
                0,
                band.y - band.radius,
                0,
                band.y + band.radius
            );

        glow.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );

        glow.addColorStop(
            0.28,
            band.color
        );

        glow.addColorStop(
            0.50,
            band.color
        );

        glow.addColorStop(
            0.72,
            band.color
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle = glow;

        ctx.fillRect(
            0, 0,
            w, h
        );
    }


    /* =====================================
       SUBTLE DEEP-PURPLE VEIL

       Keeps the bright nebula rich rather
       than looking like a rainbow screen.
    ===================================== */

    const veil =
        ctx.createLinearGradient(
            0, 0,
            0, h
        );

    veil.addColorStop(
        0,
        "rgba(25,5,45,0.12)"
    );

    veil.addColorStop(
        0.5,
        "rgba(5,0,20,0.04)"
    );

    veil.addColorStop(
        1,
        "rgba(0,5,30,0.12)"
    );

    ctx.fillStyle = veil;

    ctx.fillRect(
        0, 0,
        w, h
    );


    /* =====================================
       STARS
    ===================================== */

    for (const s of stars) {

        s.phase +=
            s.speed * dt;

        s.x +=
            s.drift * dt;


        if (s.x > w + 8) {

            s.x = -8;
        }


        const twinkle =
            s.base +
            Math.sin(s.phase) * 0.22;


        const alpha =
            Math.max(
                0.32,
                Math.min(
                    1,
                    twinkle
                )
            );


        const [r,g,b] =
            s.color;


        /* Soft star glow */

        if (s.r > 0.9) {

            ctx.beginPath();

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha * 0.14})`;

            ctx.arc(
                s.x,
                s.y,
                s.r * 4.2,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /* Bright star center */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(${r},${g},${b},${alpha})`;

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Romantic diamond sparkle */

        if (
            s.r > 1.45 &&
            alpha > 0.76
        ) {

            ctx.strokeStyle =
                `rgba(${r},${g},${b},${alpha * 0.50})`;

            ctx.lineWidth = 0.65;

            ctx.beginPath();

            ctx.moveTo(
                s.x - s.r * 3.2,
                s.y
            );

            ctx.lineTo(
                s.x + s.r * 3.2,
                s.y
            );

            ctx.moveTo(
                s.x,
                s.y - s.r * 3.2
            );

            ctx.lineTo(
                s.x,
                s.y + s.r * 3.2
            );

            ctx.stroke();
        }
    }


    /* =====================================
       SHOOTING STARS
    ===================================== */

    for (
        let i = shooters.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shooters[i];


        const magnitude =
            Math.sqrt(
                s.vx * s.vx +
                s.vy * s.vy
            );


        const tailX =
            s.x -
            (s.vx / magnitude) *
            s.length;


        const tailY =
            s.y -
            (s.vy / magnitude) *
            s.length;


        const trail =
            ctx.createLinearGradient(
                tailX,
                tailY,
                s.x,
                s.y
            );


        trail.addColorStop(
            0,
            "rgba(125,90,255,0)"
        );


        trail.addColorStop(
            0.45,
            `rgba(180,125,255,${s.life * 0.30})`
        );


        trail.addColorStop(
            0.78,
            `rgba(255,115,220,${s.life * 0.72})`
        );


        trail.addColorStop(
            1,
            `rgba(255,245,255,${s.life})`
        );


        ctx.strokeStyle =
            trail;

        ctx.lineWidth =
            1.8;


        ctx.beginPath();

        ctx.moveTo(
            tailX,
            tailY
        );

        ctx.lineTo(
            s.x,
            s.y
        );

        ctx.stroke();


        /* Shooting star head */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,245,255,${s.life})`;

        ctx.arc(
            s.x,
            s.y,
            1.9,
            0,
            Math.PI * 2
        );

        ctx.fill();


        s.x +=
            s.vx * dt * 0.05;

        s.y +=
            s.vy * dt * 0.05;


        s.life -=
            dt * 0.00065;


        if (s.life <= 0) {

            shooters.splice(
                i,
                1
            );
        }
    }


    /* =====================================
       RANDOM SHOOTING STAR
       About every 6–12 seconds
    ===================================== */

    if (now > nextShooter) {

        shootingStar();

        nextShooter =
            now +
            6000 +
            Math.random() * 6000;
    }


    requestAnimationFrame(draw);
}


/* =========================================
   START
========================================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(draw);

</script>

</body>
</html>
